<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ВК-лаборатория — каталог интерактивов и инструментов</title>
  <meta name="description" content="Хаб ВК-лаборатории: игры, школьные генераторы, скрипты и макросы. Выбирай категорию — инструменты вылетают плитками. Без оплаты, с открытым кодом.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ВК-лаборатория">
  <meta property="og:title" content="ВК-лаборатория — каталог">
  <meta property="og:description" content="Игры · Школа · Скрипты · Генераторы · Заказы. Кликни категорию — инструменты вылетают плитками. 0 ₽, код открыт.">
  <meta property="og:url" content="https://petrvoroshilov.github.io/vk-laboratory/">
  <meta property="og:image" content="https://petrvoroshilov.github.io/vk-laboratory/preview-home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root{--bg:#070b14;--card:rgba(17,24,39,.86);--accent:#22d3ee;--accent2:#a3e635;--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(34,211,238,.16),transparent 30%),radial-gradient(circle at 85% 90%,rgba(163,230,53,.12),transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px}
    .wrap{max-width:920px;margin:0 auto}
    .hero{text-align:center;padding:18px 18px 24px}
    .logo{width:72px;height:72px;margin:0 auto 12px;display:block}
    .tag{color:var(--accent2);font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:12px;margin-bottom:8px}
    h1{font-size:clamp(26px,6vw,42px);margin:0 0 8px;letter-spacing:.5px}
    .sub{color:var(--muted);font-size:15px;line-height:1.5;max-width:560px;margin:0 auto}
    .tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 18px}
    .tab{appearance:none;border:1px solid var(--border);cursor:pointer;font:inherit;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:700;font-size:14px;transition:transform .12s,background .12s,color .12s,border-color .12s}
    .tab:hover{transform:translateY(-1px);color:var(--text)}
    .tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06121a;border-color:transparent}
    .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;min-height:120px}
    .deck.reveal{animation:pop .42s cubic-bezier(.2,.8,.2,1)}
    @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
    .tile{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 44px rgba(0,0,0,.4);text-decoration:none;color:inherit;transition:transform .14s,border-color .14s}
    .tile:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.45)}
    .thumb{height:120px;background:#0a0f1c;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
    .thumb svg{width:100%;height:100%}
    .t-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
    .kicker{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
    .t-body h3{margin:0;font-size:18px}
    .t-body p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;flex:1}
    .go{margin-top:4px;font-weight:800;font-size:13px;color:var(--accent2)}
    .tile.soon{opacity:.62;cursor:default}
    .tile.soon:hover{transform:none;border-color:var(--border)}
    .tile.soon .go{color:var(--muted)}
    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;line-height:1.5}
    footer a{color:var(--accent)}
    @media(max-width:520px){.tab{padding:9px 14px;font-size:13px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <svg class="logo" viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
        <rect x="91" y="38" width="18" height="34" rx="6" fill="#e5f7ff"/>
        <path d="M72 72 L56 126 C52 146 66 162 86 162 L114 162 C134 162 148 146 144 126 L128 72 Z" fill="url(#lg)"/>
        <path d="M72 72 L56 126 C52 146 66 162 86 162 L114 162 C134 162 148 146 144 126 L128 72 Z" fill="none" stroke="#dffafe" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="86" cy="126" r="6" fill="#fff" opacity=".55"/><circle cx="108" cy="140" r="4" fill="#fff" opacity=".45"/>
      </svg>
      <div class="tag">Ежедневные эксперименты</div>
      <h1>ВК-лаборатория</h1>
      <div class="sub">Выбери категорию сверху — инструменты вылетят плитками ниже. Всё бесплатно, с открытым кодом, запуск прямо в браузере.</div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab" data-cat="games">🎮 Игры</button>
      <button class="tab" data-cat="school">🎓 Школа</button>
      <button class="tab" data-cat="scripts">🛠 Скрипты</button>
      <button class="tab" data-cat="generators">🖨 Генераторы</button>
      <button class="tab" data-cat="orders">📦 Заказы</button>
    </div>

    <div class="deck" id="deck"></div>

    <footer>Сообщество ВКонтакте: <a href="https://vk.ru/vklaboratory1">vk.ru/vklaboratory1</a><br>Код: github.com/petrvoroshilov/vk-laboratory · GitHub Pages + Cloudflare Pages (бесплатно)</footer>
  </div>

  <script>
    const THUMB={
      elevator:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><rect x="74" y="14" width="52" height="92" rx="3" fill="none" stroke="#46557d" stroke-width="2"/><rect x="76" y="16" width="24" height="88" fill="#28324c"/><rect x="100" y="16" width="24" height="88" fill="#28324c"/><line x1="100" y1="18" x2="100" y2="102" stroke="#0c1120" stroke-width="2"/><circle cx="100" cy="22" r="3" fill="#ffe9a8"/><circle cx="100" cy="56" r="5" fill="#cfe9ff"/><path d="M95 62 Q100 60 105 62 L106 84 Q100 87 94 84 Z" fill="#cfe9ff"/></svg>',
      lines:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><rect x="64" y="10" width="72" height="100" rx="2" fill="#fff"/><line x1="78" y1="10" x2="78" y2="110" stroke="#f0a6b6" stroke-width="1.2"/><g stroke="#aeb8cc" stroke-width=".7"><line x1="78" y1="30" x2="132" y2="30"/><line x1="78" y1="46" x2="132" y2="46"/><line x1="78" y1="62" x2="132" y2="62"/><line x1="78" y1="78" x2="132" y2="78"/><line x1="78" y1="94" x2="132" y2="94"/><line x1="96" y1="30" x2="96" y2="94"/><line x1="114" y1="30" x2="114" y2="94"/></g><g stroke="#6f9fd8" stroke-width=".9"><line x1="78" y1="46" x2="96" y2="30"/><line x1="96" y1="62" x2="114" y2="46"/></g></svg>',
      skeleton:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><ellipse cx="100" cy="40" rx="12" ry="13" fill="#e2e8f0"/><circle cx="95" cy="39" r="3" fill="#a3e635"/><circle cx="105" cy="39" r="3" fill="#a3e635"/><g stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round"><line x1="100" y1="53" x2="100" y2="78"/><line x1="92" y1="58" x2="108" y2="58"/><line x1="92" y1="64" x2="108" y2="64"/><line x1="92" y1="70" x2="108" y2="70"/><line x1="92" y1="56" x2="84" y2="68"/><line x1="108" y1="56" x2="116" y2="68"/><line x1="96" y1="78" x2="93" y2="98"/><line x1="104" y1="78" x2="107" y2="98"/></g><ellipse cx="100" cy="104" rx="60" ry="8" fill="#4c1d95" opacity=".4"/></svg>',
      examples:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><rect x="58" y="12" width="84" height="96" rx="3" fill="#fff"/><g fill="#33415c" font-family="Georgia,serif" font-size="9"><text x="66" y="34">7 + 5 =</text><text x="66" y="52">9 - 3 =</text><text x="66" y="70">4 + 6 =</text><text x="110" y="34">8 - 2 =</text><text x="110" y="52">6 + 4 =</text><text x="110" y="70">5 + 5 =</text></g><line x1="66" y1="86" x2="134" y2="86" stroke="#a3e635" stroke-width="1.5"/></svg>',
      random:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><circle cx="100" cy="58" r="30" fill="none" stroke="#22d3ee" stroke-width="2.5"/><circle cx="100" cy="58" r="30" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-dasharray="6 8"/><g fill="#e2e8f0"><circle cx="92" cy="50" r="3"/><circle cx="108" cy="50" r="3"/><circle cx="100" cy="58" r="3"/><circle cx="92" cy="66" r="3"/><circle cx="108" cy="66" r="3"/></g><path d="M100 22 l5 8 h-10 z" fill="#fb7185"/></svg>',
      tempclean:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><path d="M82 38 h36 l-3 50 a4 4 0 0 1 -4 4 h-22 a4 4 0 0 1 -4 -4 z" fill="none" stroke="#e2e8f0" stroke-width="2.5"/><line x1="78" y1="38" x2="122" y2="38" stroke="#e2e8f0" stroke-width="2.5"/><path d="M92 38 v-5 a4 4 0 0 1 4 -4 h8 a4 4 0 0 1 4 4 v5" fill="none" stroke="#e2e8f0" stroke-width="2.5"/><g stroke="#22d3ee" stroke-width="2"><line x1="94" y1="50" x2="94" y2="82"/><line x1="100" y1="50" x2="100" y2="82"/><line x1="106" y1="50" x2="106" y2="82"/></g><circle cx="128" cy="34" r="3" fill="#a3e635"/><circle cx="134" cy="44" r="2" fill="#a3e635"/></svg>',
      ghost:'<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#0a0f1c"/><circle cx="100" cy="56" r="22" fill="none" stroke="#3c4a6e" stroke-width="2" stroke-dasharray="4 4"/><text x="100" y="62" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#3c4a6e">+</text></svg>'
    };
    const CAT={
      games:[
        {href:"elevator/",kicker:"Интерактив · мини-мультик",title:"Ты застрял в лифте",desc:"Здание с окнами, едущая кабина, 7 концовок, прогресс сохраняется.",go:"Играть →",thumb:"elevator"},
        {href:"skeleton/",kicker:"Аркада · реакция",title:"Скелеты из тумана",desc:"Тапай по скелетам, пока не встали. 3 жизни, скорость растёт, рекорд.",go:"Играть →",thumb:"skeleton"}
      ],
      school:[
        {href:"lines/",kicker:"Генератор · печать/PDF",title:"Разлиновка А4",desc:"Клетка 5/7/8 мм, косая, парадная, секретные линии, шапка с именем.",go:"Открыть →",thumb:"lines"},
        {href:"examples/",kicker:"Генератор · печать/PDF",title:"Примеры 1 класс",desc:"Сложение и вычитание в пределах 10/20, режим ученик/учитель.",go:"Открыть →",thumb:"examples"}
      ],
      scripts:[
        {href:"tempclean/",kicker:"Windows · batch",title:"Очистка temp",desc:"Готовый .bat с подтверждением и разбором каждой строки. Скачать кликом.",go:"Открыть →",thumb:"tempclean"}
      ],
      generators:[
        {href:"random/",kicker:"Инструмент · жребий",title:"Случайный выбор",desc:"Список имён → барабан → победитель или перемешанный порядок. История.",go:"Открыть →",thumb:"random"}
      ],
      orders:[]
    };
    const SOON={
      scripts:"Скоро: макросы Word/Excel (уборка текста, сравнение списков), BAS — с исходником и разбором.",
      generators:"Скоро: генератор паролей, таймер/секундомер, конвертеры — без установки.",
      orders:"Здесь будут индивидуальные разработки под вашу задачу. Хотите — напишите в обсуждение рубрики."
    };
    const deck=document.getElementById("deck"),tabs=document.getElementById("tabs");
    function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
    function tileHTML(t){
      return '<a class="tile" href="'+esc(t.href)+'"><div class="thumb">'+(THUMB[t.thumb]||THUMB.ghost)+'</div><div class="t-body"><div class="kicker">'+esc(t.kicker)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p><span class="go">'+esc(t.go)+'</span></div></a>';
    }
    function soonHTML(text){
      return '<div class="tile soon"><div class="thumb">'+THUMB.ghost+'</div><div class="t-body"><div class="kicker">В работе</div><h3>Скоро здесь</h3><p>'+esc(text)+'</p><span class="go">Следите за лентой</span></div></div>';
    }
    function render(cat){
      const items=CAT[cat]||[];
      let html=items.map(tileHTML).join("");
      if(items.length===0 && SOON[cat]) html=soonHTML(SOON[cat]);
      deck.innerHTML=html;
      deck.classList.remove("reveal"); void deck.offsetWidth; deck.classList.add("reveal");
    }
    function setActiveTab(cat){
      [...tabs.children].forEach(x=>x.classList.toggle("active", x.dataset.cat===cat));
    }
    const params=new URLSearchParams(location.search);
    const wantCat=params.get("cat");
    const startCat=(wantCat && Object.prototype.hasOwnProperty.call(CAT,wantCat))?wantCat:"games";
    setActiveTab(startCat);
    render(startCat);
    tabs.addEventListener("click",e=>{
      const b=e.target.closest(".tab"); if(!b) return;
      setActiveTab(b.dataset.cat);
      render(b.dataset.cat);
    });
  </script>
</body>
</html>
