<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Онлайн-тренажёр «определи время по часам» для 1 класса | ВК-лаборатория</title>
<meta name="description" content="Бесплатный интерактивный тренажёр: посмотри на аналоговые часы и выбери correctное время. Уровни полные часы/четверти/минуты, серия вопросов, счёт, рекорд, включаемый звук. Работает на телефоне. Без установки, 0 ₽.">
<link rel="canonical" href="https://petrvoroshilov.github.io/vk-laboratory/clocks/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ВК-лаборатория">
<meta property="og:title" content="Сколько времени? — тренажёр часов">
<meta property="og:description" content="Аналоговые часы + выбор времени. Уровни, серия, рекорд, звук on/off. 0 ₽.">
<meta property="og:url" content="https://petrvoroshilov.github.io/vk-laboratory/clocks/">
<meta property="og:image" content="https://petrvoroshilov.github.io/vk-laboratory/clocks/preview-clocks.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#070b14;--card:rgba(17,24,39,.86);--accent:#22d3ee;--accent2:#a3e635;--danger:#fb7185;--text:#e5e7eb;--muted:#9ca3af;--border:rgba(255,255,255,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 12%,rgba(34,211,238,.16),transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.app{width:min(560px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.5);overflow:hidden;backdrop-filter:blur(10px)}
header{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:800;color:var(--accent)}.badge{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:6px 11px;border-radius:999px}
main{padding:16px 18px 20px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.bar b{color:var(--text)}
.prog{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.clockwrap{display:flex;justify-content:center;margin:0 0 14px}
.clockwrap svg{width:min(220px,60vw);height:auto}
.q{font-size:16px;text-align:center;margin:0 0 14px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{appearance:none;border:0;cursor:pointer;font:inherit}
.opt{padding:14px 10px;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);font-size:20px;font-weight:800;text-align:center;transition:transform .12s,background .12s,border-color .12s}
.opt:hover:not(:disabled){background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.45);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.right{background:rgba(163,230,53,.18);border-color:rgba(163,230,53,.5);color:#d9f99d}
.opt.wrong{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.5)}
.finish{text-align:center;padding:8px 0}
.finish .big{font-size:34px;font-weight:800;color:#fff;margin:4px 0}
.finish p{color:var(--muted);line-height:1.6;margin:4px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 16px}
.ghost{padding:10px 16px;border-radius:999px;background:transparent;color:var(--muted);border:1px solid var(--border);font-size:13px}
.ghost:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.selrow{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
select{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);font:inherit}
footer{padding:11px 18px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
footer a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;border:1px solid rgba(255,255,255,.16);padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 32px);text-align:center;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">ВК-лаборатория · Школа</div><div class="badge" id="recBadge">Рекорд 0/0</div></header>
<main>
  <div id="play">
    <div class="selrow">Уровень:
      <select id="lvl"><option value="hour" selected>полные часы</option><option value="quarter">четверти/половина</option><option value="min">произвольные минуты</option></select>
      <select id="len"><option value="8">8 вопросов</option><option value="12" selected>12 вопросов</option><option value="20">20 вопросов</option></select>
    </div>
    <div class="bar"><span>Вопрос <b id="qnum">1</b>/<b id="qtot">12</b></span><span>Верно: <b id="score">0</b> · Серия: <b id="streak">0</b></span></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="clockwrap" id="clock"></div>
    <p class="q">Сколько времени показывают часы?</p>
    <div class="opts" id="opts"></div>
  </div>
  <div id="fin" class="finish" style="display:none">
    <div class="big" id="fscore">0/12</div>
    <p id="fnote"></p>
  </div>
</main>
<div class="controls">
  <button class="ghost" id="restartBtn">Начать заново</button>
  <button class="ghost" id="muteBtn">🔊 Звук вкл</button>
  <button class="ghost" id="shareBtn">Поделиться в ВК</button>
</div>
<footer>Тренажёр чтения аналоговых часов для 1–2 класса. ВК-лаборатория · 0 ₽ · <a href="../cat/school/">вся школа</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
/* GAME-CLK-START */
var KEY="vklab_clocks_v1";
var $=function(id){return document.getElementById(id);};
var idx=0,score=0,streak=0,best=0,record=0,total=12,locked=false,MUTE=false,AC=null;
try{record=parseInt(localStorage.getItem(KEY+"_rec"),10)||0;best=parseInt(localStorage.getItem(KEY+"_best"),10)||0;MUTE=localStorage.getItem(KEY+"_m")==="1";}catch(e){record=0;best=0;}
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,d,t){if(MUTE)return;try{var a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(a.destination);var n=a.currentTime;o.start(n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.stop(n+d);}catch(e){}}
function good(){tone(660,.12,"triangle");setTimeout(function(){tone(880,.14,"triangle");},90);}
function bad(){tone(180,.22,"sawtooth");}
function win(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,.18,"triangle");},i*120);});}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("show");},2200);}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}
function pad(m){return (m<10?"0":"")+m;}
function fmt(h,m){return h+":"+pad(m);}
function genTime(){
  var lvl=$("lvl").value,h=ri(1,12),m;
  if(lvl==="hour")m=0;
  else if(lvl==="quarter")m=pick([0,15,30,45]);
  else m=ri(0,11)*5;
  return{h:h,m:m};
}
function distractors(t){
  var set={},out=[];
  function add(s){if(!set[s]){set[s]=1;out.push(s);}}
  add(fmt(t.h,t.m));
  add(fmt((t.h%12)+1,t.m));
  add(fmt(t.h===1?12:t.h-1,t.m));
  add(fmt(t.h,(t.m+15)%60));
  add(fmt(t.h,(t.m+30)%60));
  add(fmt((t.h%12)+1,(t.m+15)%60));
  var correct=fmt(t.h,t.m);
  var pool=out.filter(function(s){return s!==correct;});
  pool=pool.sort(function(){return Math.random()-0.5;}).slice(0,3);
  var all=[correct].concat(pool).sort(function(){return Math.random()-0.5;});
  return{opts:all,correct:correct};
}
function clockSVG(t){
  var cx=100,cy=100,R=88,hourAng=((t.h%12)+t.m/60)*30,minAng=t.m*6,i,s="";
  s+='<circle cx="100" cy="100" r="92" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>';
  s+='<circle cx="100" cy="100" r="80" fill="none" stroke="#1c2740" stroke-width="1"/>';
  for(i=1;i<=12;i++){var a=(i*30-90)*Math.PI/180,nx=100+Math.cos(a)*66,ny=100+Math.sin(a)*66+4;s+='<text x="'+nx.toFixed(1)+'" y="'+ny.toFixed(1)+'" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#e5e7eb">'+i+'</text>';var ta=(i*30-90)*Math.PI/180;x1=100+Math.cos(ta)*78;y1=100+Math.sin(ta)*78;x2=100+Math.cos(ta)*(i%3===0?70:74);y2=100+Math.sin(ta)*(i%3===0?70:74);s+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#94a3b8" stroke-width="'+(i%3===0?2:1)+'"/>';}
  s+='<g transform="rotate('+hourAng.toFixed(1)+' 100 100)"><line x1="100" y1="100" x2="100" y2="58" stroke="#cfe9ff" stroke-width="5" stroke-linecap="round"/></g>';
  s+='<g transform="rotate('+minAng.toFixed(1)+' 100 100)"><line x1="100" y1="100" x2="100" y2="40" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/></g>';
  s+='<circle cx="100" cy="100" r="5" fill="#a3e635"/>';
  return'<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}
var curT=null,curC=null;
function buildQ(){
  locked=false;total=parseInt($("len").value,10)||12;
  curT=genTime();curC=distractors(curT);
  $("qnum").textContent=idx+1;$("qtot").textContent=total;$("score").textContent=score;$("streak").textContent=streak;
  $("prog").style.width=(idx/total*100)+"%";
  $("clock").innerHTML=clockSVG(curT);
  var o=$("opts");o.innerHTML="";
  curC.opts.forEach(function(txt){
    var b=document.createElement("button");b.className="opt";b.type="button";b.textContent=txt;
    b.addEventListener("click",function(){answer(b,txt);});o.appendChild(b);
  });
}
function answer(btn,txt){
  if(locked)return;locked=true;
  var ok=txt===curC.correct;
  [].forEach.call($("opts").children,function(b){b.disabled=true;if(b.textContent===curC.correct)b.classList.add("right");});
  if(ok){score++;streak++;if(streak>best){best=streak;try{localStorage.setItem(KEY+"_best",String(best));}catch(e){}}good();}
  else{streak=0;btn.classList.add("wrong");bad();}
  $("score").textContent=score;$("streak").textContent=streak;
  setTimeout(function(){if(idx<total-1){idx++;buildQ();}else finish();},950);
}
function finish(){
  $("prog").style.width="100%";$("play").style.display="none";$("fin").style.display="block";
  $("fscore").textContent=score+"/"+total;
  var pct=score/total,note=pct>=0.9?"Отлично — часы читаешь на автомате.":pct>=0.6?"Хорошо, но потренируй минуты.":"Начни с уровня «полные часы» и поднимайся.";
  if(score>record){record=score;try{localStorage.setItem(KEY+"_rec",String(record));}catch(e){}note+=" Новый рекорд серии верных!";win();}
  note+=" Лучшая серия: "+best+". Рекорд: "+record+"/"+total+".";
  $("fnote").textContent=note;$("recBadge").textContent="Рекорд "+record+"/"+total;
}
function restart(){idx=0;score=0;streak=0;$("fin").style.display="none";$("play").style.display="block";try{ac().resume();}catch(e){}buildQ();}
$("restartBtn").addEventListener("click",restart);
$("lvl").addEventListener("change",function(){restart();});
$("len").addEventListener("change",function(){restart();});
$("muteBtn").addEventListener("click",function(){MUTE=!MUTE;try{localStorage.setItem(KEY+"_m",MUTE?"1":"0");}catch(e){}$("muteBtn").textContent=MUTE?"🔇 Звук выкл":"🔊 Звук вкл";if(!MUTE)good();});
$("shareBtn").addEventListener("click",function(){var t="Прошёл тренажёр часов: "+score+"/"+total+" · ВК-лаборатория";window.open("https://vk.com/share.php?url="+encodeURIComponent(window.location.href)+"&title="+encodeURIComponent(t)+"&no_vk_links=1","_blank","noopener");});
$("muteBtn").textContent=MUTE?"🔇 Звук выкл":"🔊 Звук вкл";
$("recBadge").textContent="Рекорд "+record+"/"+total;
buildQ();
/* GAME-CLK-END */
</script>
</body>
</html>
